<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dcefdf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GID">
  <link rel="icon" type="image/png" href="img/icon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the last theme and language at once, before the page draws
    (function () { try { var v = JSON.parse(localStorage.getItem("gid-ui") || "{}"); var dark = v.theme === "dark" || ((!v.theme || v.theme === "system") && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light"; document.documentElement.lang = v.lang === "km" ? "km" : "en"; window.I18N = { lang: v.lang === "km" ? "km" : "en" }; } catch (e) { window.I18N = { lang: "en" }; } })();
  </script>
  <title>GID Management System · Demo</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Animated start-up intro (plays first, then the sign-in screen shows) -->
  <script src="splash-particles.js"></script>
  <div id="app"><div class="setup card"><p>Loading…</p></div></div>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="i18n-km.js"></script>
  <script src="i18n.js"></script>
  <script src="map.js"></script>
  <script>
    // ---- Sign-in screen: account sign in, create account, or the demo passkey ----
    // Only a fingerprint (SHA-256) of the passkey is stored here, never the passkey itself.
    // To change the passkey, put the new fingerprint in PASS_HASH (see SETUP.md, "Change the passkey").
    var PASS_HASH = "718084f8bbdaf9f9059effd6f1adb66dd8f6021238c4777793a5424833900b9b";
    var PASS_KEY = "gid-pass";
    function sha256hex(str) {
      if (window.crypto && crypto.subtle && window.isSecureContext) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function (b) { return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join(""); });
      }
      // Fallback for pages not served over https
      var K = [], H = [], i, j, n = 2, c = 0;
      function frac(x) { return ((x - Math.floor(x)) * 4294967296) | 0; }
      while (c < 64) { for (j = 2; j * j <= n; j++) if (n % j === 0) break; if (j * j > n) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); } n++; }
      var bytes = Array.from(new TextEncoder().encode(str)), l = bytes.length * 8; bytes.push(128);
      while (bytes.length % 64 !== 56) bytes.push(0);
      for (i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
      var r = function (v, k) { return (v >>> k) | (v << (32 - k)); };
      for (i = 0; i < bytes.length; i += 64) {
        var w = [], a = H.slice();
        for (j = 0; j < 64; j++) {
          if (j < 16) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
          else w[j] = (w[j - 16] + (r(w[j - 15], 7) ^ r(w[j - 15], 18) ^ (w[j - 15] >>> 3)) + w[j - 7] + (r(w[j - 2], 17) ^ r(w[j - 2], 19) ^ (w[j - 2] >>> 10))) | 0;
          var t1 = (a[7] + (r(a[4], 6) ^ r(a[4], 11) ^ r(a[4], 25)) + ((a[4] & a[5]) ^ (~a[4] & a[6])) + K[j] + w[j]) | 0;
          var t2 = ((r(a[0], 2) ^ r(a[0], 13) ^ r(a[0], 22)) + ((a[0] & a[1]) ^ (a[0] & a[2]) ^ (a[1] & a[2]))) | 0;
          a = [(t1 + t2) | 0, a[0], a[1], a[2], (a[3] + t1) | 0, a[4], a[5], a[6]];
        }
        for (j = 0; j < 8; j++) H[j] = (H[j] + a[j]) | 0;
      }
      return Promise.resolve(H.map(function (x) { return (x >>> 0).toString(16).padStart(8, "0"); }).join(""));
    }
    var SESSION_KEY = "gid-session";
    var CFG = window.GID_CONFIG || {};
    var SHARED = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY); // false = local mode (browser demo): only the passkey works
    function store(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } }
    function drop(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* ignore */ } }
    function keep(k, v, remember) { try { drop(k); (remember ? localStorage : sessionStorage).setItem(k, v); } catch (e) { /* ignore */ } }
    function savedPass() { return store(PASS_KEY); }
    // ---- v23: sign in every day. A sign-in lasts until 03:00 the next morning (Phnom Penh time), so overtime after midnight is not cut.
    // The "work day" is the Phnom Penh date of (now - 3 hours). tests/harness.py computes it the same way.
    var PASS_DAY = "gid-pass-day", SESSION_DAY = "gid-session-day", SESSION_EXP = "gid-session-exp";
    var DAILY_MSG = "Please sign in again for today.";
    function workDay(t) {
      var d = new Date((t || Date.now()) - 3 * 3600000);
      try { return d.toLocaleDateString("en-CA", { timeZone: "Asia/Phnom_Penh" }); }
      catch (e) { var x = new Date(d.getTime() + 7 * 3600000); return x.getUTCFullYear() + "-" + String(x.getUTCMonth() + 1).padStart(2, "0") + "-" + String(x.getUTCDate()).padStart(2, "0"); }
    }
    // 03:00 Phnom Penh on the morning after a work day (Phnom Penh is always UTC+7)
    function dayEnd(day) { var t = Date.parse(day + "T03:00:00+07:00"); return isNaN(t) ? 0 : t + 86400000; }
    window.GID_WORKDAY = workDay;
    // When this device's sign-in ends (milliseconds), or 0 when nobody is signed in
    window.GID_SESSION_END = function () {
      var A = window.GID_AUTH; if (!A) return 0;
      var day = store(A.mode === "account" ? SESSION_DAY : PASS_DAY), end = day ? dayEnd(day) : 0;
      if (A.mode === "account") { var exp = Date.parse(A.expires_at || store(SESSION_EXP) || ""); if (!isNaN(exp) && exp > 0 && (!end || exp < end)) end = exp; }
      return end;
    };
    function stillToday(dayKey, expKey) {
      var day = store(dayKey); if (!day || day !== workDay()) return false;
      if (expKey) { var exp = Date.parse(store(expKey) || ""); if (!isNaN(exp) && Date.now() >= exp) return false; }
      return Date.now() < dayEnd(day);
    }
    // The app waits for GID_GATE. GID_AUTH says how the person came in: { mode: "account", token, staff_id, ... } or { mode: "passkey" }.
    var openGate;
    function newGate() { window.GID_GATE = new Promise(function (res) { openGate = res; }); return window.GID_GATE; }
    newGate();
    window.GID_AUTH = null;
    function dropDay() { drop(PASS_DAY); drop(SESSION_DAY); drop(SESSION_EXP); }
    // (the offline site-report queue "gid-outbox" is never touched here: it is sent after the person signs in again)
    window.GID_LOCK = function () { drop(PASS_KEY); drop(SESSION_KEY); dropDay(); location.reload(); };
    window.GID_DROP_SESSION = function () { drop(SESSION_KEY); drop(SESSION_DAY); drop(SESSION_EXP); };
    // app.js calls this when a saved sign-in is no longer valid: show the sign-in screen again and wait
    window.GID_SHOW_GATE = function (msg) { drop(SESSION_KEY); drop(SESSION_DAY); drop(SESSION_EXP); window.GID_AUTH = null; var g = newGate(); showGate(msg); return g; };

    // Load the Supabase library only when config.js has a Supabase address; otherwise run the browser demo.
    function bootApp() {
      function startApp() { var s = document.createElement("script"); s.src = "app.js"; document.body.appendChild(s); }
      if (SHARED) {
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        s.onload = startApp; s.onerror = startApp;
        document.head.appendChild(s);
      } else { startApp(); }
    }

    // Sign-in calls go to app.js (it owns the Supabase connection): window.GID_AUTH_API.rpc(name, args)
    var NET_MSG = "Can't reach the server. Check the internet and try again.";
    var SERVER_MSG = "The server could not do this right now. Try again later.";
    function callRpc(name, args) {
      return new Promise(function (res, rej) {
        if (window.GID_AUTH_API) return res(window.GID_AUTH_API);
        var t = setTimeout(function () { var e = new Error("network"); e.code = "network"; rej(e); }, 20000);
        window.addEventListener("gid:auth-ready", function () { clearTimeout(t); res(window.GID_AUTH_API); }, { once: true });
      }).then(function (api) { return api.rpc(name, args); });
    }
    function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    var strongPw = function (p) { return p.length >= 8 && /[A-Za-z]/.test(p) && /[0-9]/.test(p); };
    function eyeBtn(id, what) { return '<button type="button" class="gate-eye" data-eye="' + id + '" aria-label="Show ' + what + '">Show</button>'; }
    function field(label, input, help) { return '<label class="gate-field"><span>' + label + '</span>' + input + (help ? '<small class="gate-help">' + help + '</small>' : "") + '</label>'; }
    function pwIn(id, ac, what) { return '<span class="gate-in"><input id="' + id + '" type="password" autocomplete="' + ac + '" required>' + eyeBtn(id, what) + '</span>'; }
    var OFF = '<div class="gate-off"><p>Sign in needs the shared database. Use the demo passkey.</p><button type="button" class="btn gate-go" data-goto="pk">Use the demo passkey</button></div>';

    function showGate(msg) {
      var app = document.getElementById("app");
      var tab = SHARED ? "in" : "pk";
      try { var kicked = sessionStorage.getItem("gid-kicked"); if (kicked) { msg = msg || kicked; sessionStorage.removeItem("gid-kicked"); } } catch (x) { /* ignore */ }
      if (SHARED && store("gid-gate-tab") === "pk") tab = "pk"; // the person used the passkey last time on this device
      var tabBtn = function (k, label) { return '<button type="button" role="tab" class="gseg-b" id="t-' + k + '" data-tab="' + k + '" aria-controls="p-' + k + '">' + label + '</button>'; };
      app.innerHTML = '<main class="gate"><div class="gate-card" id="gcard">' +
        '<img class="gate-logo" src="img/logo-square.png" alt="Green In Design · Interior &amp; Exterior">' +
        '<h1>Management System</h1>' +
        '<div class="gseg" role="tablist" aria-label="How to sign in">' + tabBtn("in", "Sign in") + tabBtn("up", "Create account") + tabBtn("pk", "Demo passkey") + '</div>' +
        '<p class="gate-err info gate-msg" id="gmsg" role="status"' + (msg ? "" : " hidden") + '>' + esc(msg || "") + '</p>' +
        // Sign in
        '<div class="gate-pane" id="p-in" role="tabpanel" aria-labelledby="t-in">' + (SHARED ? '<form id="gin" autocomplete="on" novalidate>' +
          field("Phone number or email", '<input id="li" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>') +
          field("Password", pwIn("lp", "current-password", "password")) +
          '<label class="chk gate-chk"><input type="checkbox" id="lrem" checked> Remember this device</label>' +
          '<div class="gate-err" id="lerr" role="alert"></div>' +
          '<button class="btn primary gate-go" type="submit">Sign in</button>' +
          '<p class="gate-note">New here? Choose Create account. Forgot your password? Ask HR.</p></form>' : OFF) + '</div>' +
        // Create account
        '<div class="gate-pane" id="p-up" role="tabpanel" aria-labelledby="t-up">' + (SHARED ? '<form id="gup" autocomplete="on" novalidate>' +
          field("Full name", '<input id="un" type="text" autocomplete="name" required>') +
          field("Phone number or email", '<input id="ul" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>') +
          field("Password", pwIn("up1", "new-password", "password"), "At least 8 characters, with a letter and a number.") +
          field("Confirm password", pwIn("up2", "new-password", "password")) +
          field("Your job / team (so HR can find you)", '<input id="uj" type="text" autocomplete="organization-title">') +
          '<div class="gate-err" id="uerr" role="alert"></div>' +
          '<button class="btn primary gate-go" type="submit">Create account</button></form>' : OFF) + '</div>' +
        // Demo passkey (unchanged check: only the fingerprint is compared)
        '<div class="gate-pane" id="p-pk" role="tabpanel" aria-labelledby="t-pk"><form id="gate" autocomplete="off">' +
          '<p class="gate-sub">Demo only: you can switch between sample people.</p>' +
          '<label class="gate-field"><span>Passkey</span><span class="gate-in"><input id="pk" type="password" autocomplete="current-password" required aria-describedby="pkerr">' +
          '<button type="button" class="gate-eye" id="eye" data-eye="pk" aria-label="Show passkey">Show</button></span></label>' +
          '<label class="chk gate-chk"><input type="checkbox" id="rem" checked> Remember this device</label>' +
          '<p class="gate-err" id="pkerr" role="alert"></p>' +
          '<button class="btn primary gate-go" type="submit">Unlock</button>' +
          '<p class="gate-note">Demo with sample data only. Ask the system admin for the passkey.</p></form></div>' +
        '</div></main>';
      var card = document.getElementById("gcard");
      function shake() { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
      // Put the cursor in a box only on computers (mouse): on phones it would pop up the keyboard over the screen
      var FINE = (function () { try { return window.matchMedia("(pointer: fine)").matches && !window.matchMedia("(pointer: coarse)").matches; } catch (e) { return true; } })();
      function autoFocus(el) { if (el && FINE) el.focus(); }
      function pick(k, focus) {
        tab = k;
        ["in", "up", "pk"].forEach(function (x) { var b = document.getElementById("t-" + x), p = document.getElementById("p-" + x); b.classList.toggle("on", x === k); b.setAttribute("aria-selected", x === k ? "true" : "false"); b.tabIndex = x === k ? 0 : -1; p.hidden = x !== k; });
        if (focus !== false) autoFocus(document.querySelector("#p-" + k + " input:not([type=checkbox])"));
      }
      card.addEventListener("click", function (e) {
        var t = e.target.closest("[data-tab],[data-goto]"); if (t) { pick(t.dataset.tab || t.dataset.goto); return; }
        var eye = e.target.closest("[data-eye]"); if (eye) { var inp = document.getElementById(eye.dataset.eye), show = inp.type === "password"; inp.type = show ? "text" : "password"; eye.textContent = show ? "Hide" : "Show"; eye.setAttribute("aria-label", (show ? "Hide " : "Show ") + (eye.dataset.eye === "pk" ? "passkey" : "password")); }
      });
      document.querySelector(".gseg").addEventListener("keydown", function (e) {
        var order = ["in", "up", "pk"], i = order.indexOf(tab);
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); var n = order[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3]; pick(n, false); document.getElementById("t-" + n).focus(); }
      });
      pick(tab, false);
      autoFocus(document.querySelector("#p-" + tab + " input:not([type=checkbox])"));

      // Show a message in a form, with a Retry button when the server could not be reached
      function say(el, text, retryForm) {
        el.innerHTML = esc(text) + (retryForm ? ' <button type="button" class="gate-retry">Retry</button>' : "");
        if (retryForm) el.querySelector(".gate-retry").onclick = function () { retryForm.requestSubmit ? retryForm.requestSubmit() : retryForm.dispatchEvent(new Event("submit", { cancelable: true })); };
        if (typeof window.translateNow === "function") window.translateNow(el);
      }
      function busy(form, on, label) { var b = form.querySelector(".gate-go"); if (!b.dataset.label) b.dataset.label = b.textContent; b.disabled = on; b.textContent = on ? label : b.dataset.label; }
      function failed(el, form, e) { say(el, e && e.code === "server" ? SERVER_MSG : NET_MSG, form); }
      var hideMsg = function () { var m = document.getElementById("gmsg"); if (m) m.hidden = true; };

      if (SHARED) {
        var fin = document.getElementById("gin"), lerr = document.getElementById("lerr");
        fin.onsubmit = function (e) {
          e.preventDefault(); hideMsg();
          var login = document.getElementById("li").value.trim(), pw = document.getElementById("lp").value, rem = document.getElementById("lrem").checked;
          if (!login || !pw) { say(lerr, "Enter your phone number or email and your password."); return; }
          busy(fin, true, "Signing in…"); say(lerr, "");
          callRpc("gid_sign_in", { p_login: login, p_password: pw, p_device: store("gid-device-id") || "" }).then(function (r) {
            busy(fin, false);
            if (r && r.ok && r.token) {
              keep(SESSION_KEY, r.token, rem); drop(PASS_KEY); drop(PASS_DAY); keep("gid-gate-tab", "in", true);
              keep(SESSION_DAY, workDay(), rem); if (r.expires_at) keep(SESSION_EXP, String(r.expires_at), rem); else drop(SESSION_EXP);
              window.GID_AUTH = { mode: "account", token: r.token, staff_id: r.staff_id, name: r.name, must_change_password: !!r.must_change_password, expires_at: r.expires_at, verified: true, remember: rem };
              app.innerHTML = '<div class="setup card"><p>Loading…</p></div>'; openGate(); return;
            }
            var c = (r && r.error) || "";
            var text = c === "pending" ? "Your account is waiting for approval by HR or the System Admin."
              : c === "rejected" || c === "disabled" ? "This account cannot sign in. Ask HR."
              : c === "locked" ? "Too many wrong tries. Try again in " + Math.max(1, Math.ceil(Number(r.minutes) || 15)) + " minutes."
              : c === "invalid_login" ? "Enter a phone number like 012 345 678 or an email address."
              : c === "wrong" ? "Wrong phone/email or password." : SERVER_MSG;
            if (c === "wrong") { document.getElementById("lp").value = ""; shake(); }
            say(lerr, text);
          }, function (err) { busy(fin, false); failed(lerr, fin, err); });
        };
        var fup = document.getElementById("gup"), uerr = document.getElementById("uerr");
        // A message under one box (and the cursor put there)
        function fieldErr(id, text) {
          var inp = document.getElementById(id), lab = inp.closest(".gate-field"), el = lab.querySelector(".gate-ferr");
          if (!el) { el = document.createElement("small"); el.className = "gate-ferr"; el.setAttribute("role", "alert"); lab.appendChild(el); }
          el.textContent = text; inp.setAttribute("aria-invalid", "true"); inp.focus();
          inp.addEventListener("input", function () { el.remove(); inp.removeAttribute("aria-invalid"); }, { once: true });
          if (typeof window.translateNow === "function") window.translateNow(el);
        }
        function clearFieldErrs() { fup.querySelectorAll(".gate-ferr").forEach(function (x) { x.remove(); }); fup.querySelectorAll("[aria-invalid]").forEach(function (x) { x.removeAttribute("aria-invalid"); }); }
        fup.onsubmit = function (e) {
          e.preventDefault(); hideMsg(); clearFieldErrs();
          var name = document.getElementById("un").value.trim(), login = document.getElementById("ul").value.trim(), p1 = document.getElementById("up1").value, p2 = document.getElementById("up2").value, note = document.getElementById("uj").value.trim();
          if (!name) { fieldErr("un", "Enter your full name."); return; }
          if (!login) { fieldErr("ul", "Enter a phone number like 012 345 678 or an email address."); return; }
          if (!strongPw(p1)) { fieldErr("up1", "At least 8 characters, with a letter and a number."); return; }
          if (p1 !== p2) { fieldErr("up2", "The two passwords are not the same."); return; }
          busy(fup, true, "Sending…"); say(uerr, "");
          callRpc("gid_sign_up", { p_login: login, p_password: p1, p_name: name, p_note: note }).then(function (r) {
            busy(fup, false);
            if (r && r.ok) {
              document.getElementById("p-up").innerHTML = '<div class="gate-done"><p class="gate-ok" role="status">Request sent. You can sign in after HR or the System Admin approves you.</p><button type="button" class="btn primary gate-go" data-goto="in">Back to sign in</button></div>';
              var li = document.getElementById("li"); if (li) li.value = login;
              if (typeof window.translateNow === "function") window.translateNow(document.getElementById("p-up"));
              return;
            }
            var c = (r && r.error) || "";
            if (c === "invalid_login" && r.field === "name") return fieldErr("un", "Enter your full name.");
            if (c === "invalid_login") return fieldErr("ul", "Enter a phone number like 012 345 678 or an email address.");
            if (c === "weak_password") return fieldErr("up1", "At least 8 characters, with a letter and a number.");
            if (c === "exists") return fieldErr("ul", "This phone number or email already has an account. Sign in, or ask HR to reset your password.");
            say(uerr, SERVER_MSG);
          }, function (err) { busy(fup, false); failed(uerr, fup, err); });
        };
      }

      var f = document.getElementById("gate"), pk = document.getElementById("pk"), err = document.getElementById("pkerr"), fails = 0, waitUntil = 0;
      f.onsubmit = function (e) {
        e.preventDefault(); hideMsg();
        if (Date.now() < waitUntil) { err.textContent = "Too many tries. Wait " + Math.ceil((waitUntil - Date.now()) / 1000) + " seconds."; return; }
        sha256hex(pk.value).then(function (h) {
          if (h === PASS_HASH) {
            keep(PASS_KEY, h, document.getElementById("rem").checked); drop(SESSION_KEY); drop(SESSION_DAY); drop(SESSION_EXP); keep("gid-gate-tab", "pk", true);
            keep(PASS_DAY, workDay(), document.getElementById("rem").checked);
            window.GID_AUTH = { mode: "passkey" };
            app.innerHTML = '<div class="setup card"><p>Loading…</p></div>'; openGate();
          } else {
            fails++; pk.value = ""; pk.focus(); shake();
            if (fails >= 5) { waitUntil = Date.now() + 30000; fails = 0; err.textContent = "Wrong passkey 5 times. Wait 30 seconds and try again."; }
            else err.textContent = "Wrong passkey. Check capital letters and try again.";
          }
        });
      };
    }
    // When the intro finishes, put the cursor in the first box of the open tab
    window.addEventListener("gid:splash-done", function () { var fine = false; try { fine = matchMedia("(pointer: fine)").matches && !matchMedia("(pointer: coarse)").matches; } catch (e) { /* ignore */ } var p = document.querySelector(".gate-pane:not([hidden]) input:not([type=checkbox])"); if (p && fine) p.focus(); });
    // A saved account sign-in is checked by app.js (gid_session) before the app opens; a saved passkey opens straight away.
    // v23: a sign-in from an earlier work day (before 03:00 today) is not used: the person signs in again.
    if (SHARED && store(SESSION_KEY) && !stillToday(SESSION_DAY, SESSION_EXP)) {
      var oldTok = store(SESSION_KEY); drop(SESSION_KEY); drop(SESSION_DAY); drop(SESSION_EXP);
      callRpc("gid_sign_out", { p_token: oldTok }).catch(function () { /* the server ends it at 03:00 anyway */ });
      showGate(DAILY_MSG);
    }
    else if (SHARED && store(SESSION_KEY)) { window.GID_AUTH = { mode: "account", token: store(SESSION_KEY), verified: false, remember: (function () { try { return !!localStorage.getItem(SESSION_KEY); } catch (e) { return false; } })() }; openGate(); }
    else if (savedPass() === PASS_HASH && stillToday(PASS_DAY)) { window.GID_AUTH = { mode: "passkey" }; openGate(); }
    else if (savedPass() === PASS_HASH) { drop(PASS_KEY); drop(PASS_DAY); showGate(DAILY_MSG); }
    else showGate();
    // Start loading the app straight away, even while the sign-in screen is showing
    bootApp();
  </script>
</body>
</html>
